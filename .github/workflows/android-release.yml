name: Android release APK

# Phone builds are not committed. Every push to main (and a manual run)
# replaces the asset on the rolling prerelease tag `latest`:
# https://github.com/ViKing-sketch/3D-MViewer/releases/download/latest/field-bim-viewer-arm64.apk
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tools/android_sideload/**"
      - "tools/check_release_apk.sh"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      # v3 still installs the removed SDK package `tools` and fails the job.
      - uses: android-actions/setup-android@v4
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
      - name: Build release APK (arm64)
        working-directory: app
        run: |
          set -eu
          code=$((10000 + ${GITHUB_RUN_NUMBER:-0}))
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name "0.1.4" \
            --build-number "$code"
          src="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$src" ]; then
            echo "expected $src" >&2
            ls -l build/app/outputs/flutter-apk >&2 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$src" "$GITHUB_WORKSPACE/dist/field-bim-viewer-arm64.apk"
      - name: Verify the APK is installable
        run: |
          set -o pipefail
          tools/check_release_apk.sh dist/field-bim-viewer-arm64.apk | tee dist/apk-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: field-bim-viewer-arm64
          if-no-files-found: error
          path: |
            dist/field-bim-viewer-arm64.apk
            dist/apk-build.txt

  publish:
    needs: apk
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: field-bim-viewer-arm64
          path: dist
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          asset="dist/field-bim-viewer-arm64.apk"
          test -f "$asset"
          title="Field BIM Viewer (latest)"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$asset" --clobber
            gh release edit latest --prerelease --title "$title" --notes-file dist/apk-build.txt
          else
            gh release create latest "$asset" \
              --prerelease \
              --title "$title" \
              --notes-file dist/apk-build.txt \
              --target "${{ github.sha }}"
          fi
          gh release view latest --json url,tagName,isPrerelease,assets \
            --jq '{url,tag:.tagName,prerelease:.isPrerelease,assets:[.assets[].name]}'
