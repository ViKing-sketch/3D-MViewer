name: CI

# pull_request covers branch updates that already have a PR.
# push is limited to main so a branch push does not also start a second run.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang-format
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc
      - name: Test
        run: ctest --preset linux-gcc --output-on-failure
      - name: clang-format
        run: |
          git ls-files '*.cpp' '*.h' '*.hpp' '*.c' \
            | grep -E '^(core|converter)/' \
            | xargs clang-format --dry-run --Werror

  windows:
    # windows-latest is the VS 2026 image and does not provide the
    # "Visual Studio 17 2022" generator used by the windows-msvc preset.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc --config Release
      - name: Test
        run: ctest --preset windows-msvc --output-on-failure -C Release

  linux-ifcopenshell:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            libboost-system-dev libboost-program-options-dev libboost-regex-dev \
            libboost-thread-dev libboost-date-time-dev libboost-iostreams-dev \
            libboost-locale-dev \
            libgl1-mesa-dev libegl1-mesa-dev libeigen3-dev
      - name: Configure
        run: cmake --preset linux-gcc-ifcopenshell
      - name: Build
        run: cmake --build --preset linux-gcc-ifcopenshell
      - name: Test
        run: ctest --preset linux-gcc-ifcopenshell --output-on-failure

  windows-ifcopenshell:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          if (-not $root) { $root = $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root) { $root = "C:\vcpkg" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-ifcopenshell "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build --preset windows-msvc-ifcopenshell --config Release
      - name: Test
        run: ctest --preset windows-msvc-ifcopenshell --output-on-failure -C Release

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libsqlite3-0
      - name: Build fbv_core
        run: |
          cmake --preset linux-gcc
          cmake --build --preset linux-gcc --target fbv_core
      - name: Flutter analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          FBV_CORE_LIB="$GITHUB_WORKSPACE/build/linux-gcc/core/libfbv_core.so" flutter test
